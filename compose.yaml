
configs:
  node-cache-corefile:
    content: |
      .:53 {
          errors
          log
          health :8080
          prometheus :9253
          cache {
              success 60 10
              denial 30 5
          }
          redis_cache {
              success ${REDIS_CACHE_SUCCESS_MAX:-1h} ${REDIS_CACHE_SUCCESS_MIN:-30s}
              denial ${REDIS_CACHE_DENIAL_MAX:-30m} ${REDIS_CACHE_DENIAL_MIN:-15s}
              endpoint valkey-master:6379
              read_endpoint valkey-replica:6379
              key_prefix "" # no prefix to keep keys clean - dedicated instance
                password ${VALKEY_PASSWORD:-changeMeViaEnvFile}
              timeout {
                  connect ${REDIS_CACHE_TIMEOUT_CONNECT:-1s}
                  read ${REDIS_CACHE_TIMEOUT_READ:-1s}
                  write ${REDIS_CACHE_TIMEOUT_WRITE:-2s}
              }
              resolver __PILLAR__CLUSTER__DNS__
          }
          forward . kube-dns-upstream {
              resolver __PILLAR__CLUSTER__DNS__
              resolve_interval 30s
          }
          loop
          reload
          loadbalance
      }
  kube-dns-upstream-corefile:
    content: |
      .:53 {
          forward . 8.8.8.8:53 8.8.4.4:53
          log
          errors
      }

services:
  node-cache:
    image: ${NODE_CACHE_IMAGE_REPO:-ghcr.io/dragoangel}/${NODE_CACHE_IMAGE_NAME:-k8s-dns-node-redis-cache}:${NODE_CACHE_IMAGE_TAG:-latest}
    environment:
      # Simulate Kubernetes service env var for __PILLAR__CLUSTER__DNS__ resolution.
      KUBE_DNS_UPSTREAM_SERVICE_HOST: "127.0.0.11"
    ports:
      - "${DNS_BIND_IP:-127.0.0.1}:${DNS_BIND_PORT:-5553}:53/udp"
      - "${DNS_BIND_IP:-127.0.0.1}:${DNS_BIND_PORT:-5553}:53/tcp"
      - "9253:9253"
    depends_on:
      valkey-master:
        condition: service_healthy
      valkey-replica:
        condition: service_healthy
      kube-dns-upstream:
        condition: service_started
    command:
      - -localip
      - 0.0.0.0
      - -conf
      - /etc/Corefile
      - -skipteardown
      - -setupinterface=false
      - -setupiptables=false
      - -upstreamsvc
      - kube-dns-upstream
    configs:
      - source: node-cache-corefile
        target: /etc/coredns/Corefile.base
  valkey-master:
    image: ${VALKEY_IMAGE_REPO:-valkey}/${VALKEY_IMAGE_NAME:-valkey}:${VALKEY_IMAGE_TAG:-9.0.4-alpine}
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:-changeMeViaEnvFile}
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-64mb}
      - --maxmemory-policy
      - ${VALKEY_MAXMEMORY_POLICY:-allkeys-lru}
    ports:
      - "${VALKEY_MASTER_BIND_IP:-127.0.0.1}:${VALKEY_MASTER_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:-changeMeViaEnvFile}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey-replica:
    image: ${VALKEY_IMAGE_REPO:-valkey}/${VALKEY_IMAGE_NAME:-valkey}:${VALKEY_IMAGE_TAG:-9.0.4-alpine}
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:-changeMeViaEnvFile}
      - --replicaof
      - valkey-master
      - "6379"
      - --masterauth
      - ${VALKEY_PASSWORD:-changeMeViaEnvFile}
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-64mb}
      - --maxmemory-policy
      - ${VALKEY_MAXMEMORY_POLICY:-allkeys-lru}
    ports:
      - "${VALKEY_REPLICA_BIND_IP:-127.0.0.1}:${VALKEY_REPLICA_PORT:-6380}:6379"
    depends_on:
      valkey-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:-changeMeViaEnvFile}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Upstream DNS service — simulates a hostname-based upstream (e.g. ns-dns.ns-dns.cluster.local)
  # The forward plugin resolves "kube-dns-upstream" via Docker DNS (127.0.0.11) to this container's IP
  kube-dns-upstream:
    image: ${COREDNS_IMAGE_REPO:-coredns}/${COREDNS_IMAGE_NAME:-coredns}:${COREDNS_IMAGE_TAG:-1.14.3}
    command:
      - -conf
      - /etc/coredns/Corefile
    configs:
      - source: kube-dns-upstream-corefile
        target: /etc/coredns/Corefile
